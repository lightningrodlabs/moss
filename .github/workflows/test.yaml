name: test-workflow

# why: this workflow used to also run a 5-platform electron-builder packaging
# matrix on every push/PR. That packaging build is overkill as a routine gate —
# it is already covered at release time by release.yaml (push to `release`) and
# on demand by release-dev.yaml (workflow_dispatch). So this workflow is now
# just the tryorama DNA tests; platform builds are release-only.
on:
  push:
    branches: [main, main-*, develop]
  pull_request:
    branches: [main, main-*, develop]

# why: when several pushes land on a PR branch in quick succession, only the
# newest needs to finish — cancel the superseded in-flight runs rather than
# letting each run the full ~15min tryorama suite.
concurrency:
  group: test-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # why: a fast, pure-Node quality gate deliberately decoupled from the slow
  # nix/holochain tryorama build below — the TypeScript typecheck of the
  # electron app and the wdocker CLI plus the main/renderer unit suite (incl.
  # the validate-media-url SSRF harness). Kept separate so a red
  # Rust/holochain build never masks a unit/type regression, and so PRs get a
  # signal in ~2min instead of ~15.
  unit-and-typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      # why: --frozen-lockfile makes a stale yarn.lock fail the gate rather than
      # silently resolving updated deps.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # why: typecheck:web resolves the @theweave/* packages from their built
      # dist/, so the libraries must be compiled before tsc runs. build:libs is
      # pure tsc — no holochain binaries needed.
      - name: Build libraries
        run: yarn build:libs

      - name: Typecheck (node + web + wdocker)
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

  tryorama-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Go stable
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'

      - name: Setup environment
        run: |
          mkdir resources/default-apps
          mkdir resources/bins
          yarn install

      - name: Build environment 1/2
        run: |
          yarn build:libs
          yarn build:iframes
          yarn prepare:default-apps

      - name: Build environment 2/2
        run: |
          yarn fetch:hc
          yarn fetch:binaries
          yarn check:binaries
          yarn install --check-files

      - name: Build zomes
        run: |
          rustup target add wasm32-unknown-unknown
          yarn build:zomes

      - name: Build example-applet
        run: yarn workspace example-applet package

      - name: Build group.happ from source
        run: yarn build:group-happ

      - name: Install nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup holochain-ci cachix
        uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - name: Run tryorama tests with nix
        run: nix develop --command yarn test
