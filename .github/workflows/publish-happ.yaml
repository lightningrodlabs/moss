name: 'release-happ'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Group happ version, e.g. 0.16.0. Defaults to the Moss version in package.json.'
        required: false
        type: string

jobs:
  publish-happ:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      releaseId: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download HC
        run: |
          node ./scripts/fetch-hc.mjs

      - name: Install rust wasm32-unknown-unknown
        run: |
          rustup target install wasm32-unknown-unknown

      - name: Build
        run: |
          RUSTFLAGS='--cfg getrandom_backend="'"custom"'"' cargo build --release --target-dir target --target wasm32-unknown-unknown --workspace

      - name: Install wasm-opt
        run: |
          BIN_VER=119
          curl -sL -o /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_${BIN_VER}/binaryen-version_${BIN_VER}-x86_64-linux.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_${BIN_VER}/bin" >> $GITHUB_PATH

      - name: Optimize all wasms
        run: |
          node ./scripts/wasm-opt-all.mjs

      - name: Pack
        run: |
          ./resources/bins/hc app pack ./workdir --recursive

      - name: Retrieve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          APP_VERSION="${INPUT_VERSION:-$(cat package.json | grep -oP '(?<="version": ")[^"]*')}"
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid group happ version: $APP_VERSION" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          if [[ "$APP_VERSION" == *-* ]]; then echo "PRERELEASE=true" >> $GITHUB_OUTPUT; else echo "PRERELEASE=false" >> $GITHUB_OUTPUT; fi
          echo "HOLOCHAIN_VERSION=$(node ./scripts/read-holochain-version.mjs)" >> $GITHUB_OUTPUT
        id: version

      - id: create-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: 'workdir/group.happ'
          body: 'See assets below to download and install this version.'
          name: Group happ v${{ steps.version.outputs.APP_VERSION }}-${{ steps.version.outputs.HOLOCHAIN_VERSION }}
          tag: group-happ-v${{ steps.version.outputs.APP_VERSION }}
          commit: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          draft: true
