name: e2e

on:
  # why: the pre-merge gate. A pull_request run fires on PR open and on every
  # push to the PR's branch, so feature work is covered without running the
  # ~12-15min job on every push to branches that have no PR yet. For an ad-hoc
  # run before opening a PR, use workflow_dispatch.
  pull_request:
    branches: [main, main-*, develop]
  # why: post-merge safety net on the integration branches (a non-ff merge
  # commit's tree was never tested as-is), and the release-branch pushes the
  # slow project keys off. Deliberately no feat/** here.
  push:
    branches: [main, main-*, develop, release, 'release-*']
  # why: the slow project (multi-agent peer discovery) is too expensive to gate
  # every push on, but should still run regularly. This weekly schedule plus
  # release-branch pushes and manual dispatch give it occasional coverage.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# why: when several pushes land on a PR branch in quick succession, only the
# newest needs to finish — cancel the superseded in-flight runs rather than
# letting all of them run the full job.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# why: per plans/ui-testing-and-cruft-cleanup.md, the suite runs Linux-only,
# single-worker, against a built artifact. Don't gate merges yet — let the
# suite shake out flakes for a week and then flip required-checks on.
jobs:
  smoke-e2e:
    runs-on: ubuntu-22.04
    # why: skip draft PRs — a draft is still WIP, so don't spend a runner on it
    # until it's marked ready for review. push / schedule / dispatch runs (no
    # pull_request payload) are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # why: locally the suite runs in ~2min, but on a cold GitHub runner the
    # first-attempt of each test hits the 240s per-test timeout (lair/conductor
    # warm-up + cold cache). Retries pass in seconds. Net effect is the suite
    # runs for ~20min including retries; setup adds ~5min. 60min gives margin.
    # Once we identify the root cause of first-run slowness on CI we can drop
    # retries and dial this back down.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Go stable
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'

      - name: Install nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup holochain-ci cachix
        uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      # why: xvfb is needed because Electron windows require a display server.
      # Even though the test runs headless from Playwright's perspective, the
      # underlying Electron process still creates real GUI windows.
      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Setup environment dirs
        run: |
          mkdir -p resources/default-apps
          mkdir -p resources/bins

      - name: Install JS deps
        # why: --ignore-engines because some transitive deps pin Node >=20.12
        # but Node 20.x in CI is fine for the test workload (matches existing
        # test.yaml behavior).
        run: yarn install --ignore-engines

      - name: Build libs + iframes + default apps
        run: |
          yarn build:libs
          yarn build:iframes
          yarn prepare:default-apps

      - name: Fetch holochain + lair + kitsune2-bootstrap-srv binaries
        run: |
          yarn fetch:hc
          yarn fetch:binaries
          yarn check:binaries
          yarn install --check-files --ignore-engines

      - name: Build zomes
        run: |
          rustup target add wasm32-unknown-unknown
          yarn build:zomes

      - name: Build group.happ from source
        run: yarn build:group-happ

      - name: Build example-applet (.webhapp for tool-library fixture)
        # why: smoke #4 / #5 use the toolCurationServer worker fixture, which
        # publishes example-applet.webhapp from example/workdir/. If that file
        # isn't built the fixture errors out at startup and every test that
        # depends on it fails instantly. Building it after build:zomes is fast.
        run: yarn build:example-applet

      - name: Build Moss (electron-vite)
        # why: produces out/main/index.js + renderer assets that the e2e
        # harness launches against. We don't run electron-builder packaging
        # here — the unpackaged build is what the harness expects.
        run: nix develop --command yarn build

      - name: Run smoke E2E suite
        id: smoke
        # why: xvfb-run gives Electron a virtual display. The Holochain
        # binaries that ship in resources/bins need glibc/libstdc++ from
        # nix, so wrap the command in `nix develop --command`. This is the
        # fast `smoke` project — it gates every push/PR.
        run: nix develop --command xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" yarn test:e2e

      - name: Run slow E2E suite (multi-agent peer discovery)
        # why: the `slow` project launches two full Moss instances and waits for
        # real cross-agent gossip convergence, which takes minutes on a
        # contended runner — see playwright.config.ts. Too expensive to gate
        # ordinary pushes on, so it runs only on release branches, the weekly
        # schedule, and manual dispatch.
        #
        # why the smoke-outcome guard: the two suites are independent, so a
        # smoke failure must not hide the slow result — run slow whenever smoke
        # actually ran (pass or fail). If an earlier build step failed, smoke
        # is skipped and this stays skipped too.
        #
        # why MOSS_E2E_DEBUG: peer-discovery failures only reproduce on CI, so
        # the moss / conductor / bootstrap-srv stdio piped by the fixture when
        # this is set is the only way to diagnose them.
        if: >-
          !cancelled()
          && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure')
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release-'))
        env:
          MOSS_E2E_DEBUG: '1'
        run: nix develop --command xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" yarn test:e2e:slow

      - name: Upload Playwright trace + video + conductor logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          # why: exclude the bulky per-profile data (conductor DBs, keystore,
          # cached UIs/happs) but keep the `logs/` subtree — those conductor
          # logs are what a real peer-discovery failure needs to be diagnosed.
          path: |
            test-results-e2e/
            !test-results-e2e/profiles/**
            test-results-e2e/profiles/**/logs/**
          if-no-files-found: ignore
          retention-days: 14
