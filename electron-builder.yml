appId: org.lightningrodlabs.moss-0.16
# Installed artifacts carry the breaking version so that Moss versions with incompatible
# group DNAs install side by side and can be told apart: the deb's /opt directory, the
# Start Menu shortcut and the .app bundle all derive from productName. The running app
# presents itself as plain "Moss" via app.setName(). Guarded by a unit test.
productName: Moss (0.16)
directories:
  buildResources: build
files:
  - resources
  - out
  - moss.config.json
  - holochain-checksums.json
asarUnpack:
  - resources/**
afterSign: scripts/notarize.js
protocols:
  # Must match WEAVE_URL_SCHEME in shared/types/src/const.ts (guarded by a unit test).
  - name: Weave URL
    schemes:
      - weave-0.16
win:
  executableName: moss
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # macOS shows CFBundleName in the menu bar and Electron locates its helper bundles by
  # it, and both derive from productName, so the mac build scripts pass
  # `-c.productName=Moss`. The bundle name comes from executableName instead and keeps
  # the version so that two Moss versions can sit in /Applications together.
  executableName: Moss (0.16)
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSAudioCaptureUsageDescription: Application requests permission to capture audio playing on this computer when a tool asks to share it.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    # - snap
  maintainer: lightningrodlabs.org
  category: Utility
  icon: ./build/icon.icns
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
